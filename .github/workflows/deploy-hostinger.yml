name: Build and Deploy Frontend to Hostinger Branch

on:
  push:
    branches:
      - main
    paths:
      - 'ccsps/ccs-partners-/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ccsps/ccs-partners-/package-lock.json'

      - name: Install Dependencies (CCS Partners Portal)
        working-directory: ccsps/ccs-partners-
        run: npm ci

      - name: Build CCS Partners ERP Portal
        working-directory: ccsps/ccs-partners-
        env:
          VITE_API_URL: https://chitracropsciencepartners.com/api
          VITE_APK_URL: https://chitracropsciencepartners.com/downloads/CCS-Connect.apk
        run: npm run build

      - name: Verify Build Artifacts and Exclude Large Binaries
        run: |
          test -f ccsps/ccs-partners-/dist/index.html || { echo "ERROR: ccsps/ccs-partners-/dist/index.html was not generated"; exit 1; }
          rm -rf ccsps/ccs-partners-/dist/downloads/*.apk 2>/dev/null || true
          echo "Verified dist build output:"
          ls -la ccsps/ccs-partners-/dist/

      - name: Deploy Compiled Frontend to hostinger-deploy Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: hostinger-deploy
          folder: ccsps/ccs-partners-/dist
          clean: true
          commit-message: "deploy: automated CCS Partners ERP portal build for Hostinger [skip ci]"
