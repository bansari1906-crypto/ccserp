# ==============================================================================
# CCS CONNECT ERP — PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# ==============================================================================
# Location: /etc/nginx/sites-available/ccs_connect.conf
# ==============================================================================

# Rate limiting zones to protect against brute-force attacks and abuse
limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;

# Upstream to Daphne ASGI daemon on localhost
upstream ccs_asgi_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name chitracropsciencepartners.com www.chitracropsciencepartners.com;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chitracropsciencepartners.com www.chitracropsciencepartners.com;

    # SSL Certificates (managed via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/chitracropsciencepartners.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chitracropsciencepartners.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads limit (Bilty PDFs, LR scans, photos)
    client_max_body_size 50M;

    # 3. Static Files (Direct filesystem delivery with aggressive caching)
    location /static/ {
        alias /var/www/ccs-connect/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 4. Media Uploads
    location /media/ {
        alias /var/www/ccs-connect/backend/media/;
        expires 7d;
        add_header Cache-Control "private, max-age=604800";
    }

    # 4b. Android APK Downloads
    location /downloads/ {
        alias /var/www/ccs-connect/public/downloads/;
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=\"CCS-Connect.apk\"";
        add_header Cache-Control "public, max-age=3600";
    }

    # 5. Rate-Limited Authentication Endpoint
    location /api/auth/login/ {
        limit_req zone=api_auth_limit burst=5 nodelay;

        proxy_pass http://ccs_asgi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 6. Real-Time WebSockets (/ws/)
    location /ws/ {
        proxy_pass http://ccs_asgi_backend;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Keepalive for active real-time connections (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 7. General REST API Proxy
    location / {
        limit_req zone=api_general_limit burst=20 nodelay;

        proxy_pass http://ccs_asgi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
